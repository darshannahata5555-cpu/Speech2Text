<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speech Notes</title>
  <style>
    * {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  padding-left: 25px;;
  background: #283c72;
}

.app {
  background: #ffffff;
  padding: 24px 28px;
  border-radius: 18px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
  max-width: 480px;
  width: 100%;
}

h1 {
  margin: 0;
  font-size: 1.8rem;
}

.subtitle {
  margin: 4px 0 16px;
  font-size: 0.9rem;
  color: #666;
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

button {
  border: none;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.1s;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  box-shadow: none;
}

#start-btn {
  background: #af94dd;
  
}

#stop-btn {
  background: #959ad0;
  
}

.save-btn {
  margin-top: 10px;
  width: 100%;
  background: #b2f5ea;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
}

button:active:not(:disabled) {
  transform: translateY(1px);
  box-shadow: none;
}

#status {
  font-size: 0.85rem;
  color: #888;
  margin: 0 0 10px;
}

label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 6px;
  color: #444;
}

textarea {
  width: 100%;
  resize: vertical;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid #e3e3e3;
  font-size: 0.95rem;
  outline: none;
  background: #fafafa;
}

textarea:focus {
  border-color: #ff91c9;
  box-shadow: 0 0 0 2px rgba(255, 145, 201, 0.25);
  background: #fff;
}

h2 {
  margin-top: 18px;
  font-size: 1.1rem;
}

.notes-list {
  list-style: none;
  padding-left: 0;
  margin-top: 8px;
  max-height: 160px;
  overflow-y: auto;
}

.notes-list li {
  background: #f7f7ff;
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 0.9rem;
  border: 1px dashed #d5d5ff;
}

  </style>>
</head>
<body>
  <div class="app">
    <h1></h1> Speech to Note</h1>
    <p class="subtitle">Click listen → speak → text appears below.</p>

    <div class="controls">
      <button id="start-btn">Start Listening</button>
      <button id="stop-btn" disabled>Stop Listening</button>
    </div>

    <p id="status">Not listening</p>

    <label for="text">Live transcript</label>
    <textarea id="text" rows="5" placeholder="Your speech will appear here..."></textarea>

    <button id="save-btn" class="save-btn">Save as note</button>

    <h2> Notes</h2>
    <ul id="notes-list" class="notes-list"></ul>
  </div>

  <script>
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

const startBtn = document.getElementById("start-btn");
const stopBtn = document.getElementById("stop-btn");
const saveBtn = document.getElementById("save-btn");
const textArea = document.getElementById("text");
const statusEl = document.getElementById("status");
const notesList = document.getElementById("notes-list");

let recognition;


  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = true; 
  recognition.continuous = true;     

  recognition.onstart = () => {
    statusEl.textContent = "Listening… ";
    startBtn.disabled = true;
    stopBtn.disabled = false;
  

  recognition.onend = () => {
    statusEl.textContent = "Not listening";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  };

  recognition.onresult = (event) => {
    let fullTranscript = "";

    for (let i = 0; i < event.results.length; i++) {
      fullTranscript += event.results[i][0].transcript;
    }

    textArea.value = fullTranscript.trim();
  };
}


startBtn.addEventListener("click", () => {
  if (recognition) recognition.start();
});

stopBtn.addEventListener("click", () => {
  if (recognition) recognition.stop();
});

saveBtn.addEventListener("click", () => {
  const text = textArea.value.trim();
  if (!text) return;

  const li = document.createElement("li");
  li.textContent = text;
  notesList.prepend(li); 
  textArea.value = "";
});

  </script>
</body>
</html>
